name: PEP8 linter

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  linter:
    strategy:
      matrix:
        python: [ "3.12" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -U pycodestyle ruff

      # ruff sees what pycodestyle structurally cannot: unused imports,
      # outdated syntax, implicit Optional, likely bugs. Configured in
      # pyproject.toml, including the deviations this project makes on purpose.
      - name: run ruff
        run: |
          ruff check --output-format=github .

      # The diff check only ever sees the current change. A violation that slips
      # through once is never reported again, so the whole tree is checked too.
      - name: run pep8check over the full tree
        run: |
          pycodestyle src/ tests/

      - name: run pep8check @pull_request
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff -U0 origin/${GITHUB_BASE_REF}..${GITHUB_SHA} | pycodestyle --diff --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s: %(text)s'

      - name: run pep8check @push
        if: ${{ github.event_name == 'push' }}
        run: |
          git show -U0 ${GITHUB_SHA} | pycodestyle --diff --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s: %(text)s'
