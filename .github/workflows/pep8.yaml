name: PEP8 linter

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  linter:
    strategy:
      matrix:
        python: [ "3.12" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -U pycodestyle ruff

      # ruff sees what pycodestyle structurally cannot: unused imports,
      # outdated syntax, implicit Optional, likely bugs. Configured in
      # pyproject.toml, including the deviations this project makes on purpose.
      - name: run ruff
        run: |
          ruff check --output-format=github .

      # The diff check only ever sees the current change. A violation that slips
      # through once is never reported again, so the whole tree is checked too.
      - name: run pep8check over the full tree
        run: |
          pycodestyle src/ tests/

      - name: run pep8check @pull_request
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git diff -U0 origin/${GITHUB_BASE_REF}..${GITHUB_SHA} | pycodestyle --diff --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s: %(text)s'

      - name: run pep8check @push
        if: ${{ github.event_name == 'push' }}
        run: |
          git show -U0 ${GITHUB_SHA} | pycodestyle --diff --format='::error file=%(path)s,line=%(row)d,col=%(col)d::%(code)s: %(text)s'

  type-checker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # mypy needs the package and the test dependencies importable to follow
      # them; the config in pyproject.toml pins the checked version to 3.11.
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[testing,dev]"

      # Rewritten into workflow commands, so findings show up inline in the PR.
      # `shell: bash` runs with pipefail, otherwise sed would swallow the exit code.
      - name: run mypy
        shell: bash
        run: |
          mypy --no-pretty --no-error-summary \
            | sed -E 's/^([^:]+):([0-9]+): error: (.*)$/::error file=\1,line=\2::\3/'
