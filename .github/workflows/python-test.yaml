name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: [ "3.11", "3.12", "3.13", "3.14" ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e ".[testing]"

      # The sandbox tests are deselected by the addopts in pyproject.toml: they
      # need credentials and would create real resources at Unzer.
      - name: Run the tests
        run: python -m pytest --cov=unzer --cov-report=term

      # Verifies requires-python and that the package imports on a clean install,
      # which a source checkout would not catch.
      - name: Verify the built package installs and imports
        run: |
          python -m pip install -U build
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp && python -c "import unzer; print(unzer.__version__)"
