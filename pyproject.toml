[build-system]
requires = [
    "setuptools>=65",
]
build-backend = "setuptools.build_meta"

[project]
name = "unzer"
dynamic = ["version"]
dependencies = [
    "requests>=2.25",
]
requires-python = ">=3.11"
authors = [
    { name = "Sven Eberth", email = "se@mausbrand.de" },
]
maintainers = [
    { name = "Sven Eberth", email = "se@mausbrand.de" },
]
description = "An unofficial python SDK for unzer.com"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["unzer", "payment", "sdk", "client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
testing = [
    "pytest",
    "pytest-cov",
    "responses",
]
dev = [
    "build",
    "pycodestyle",
    "ruff",
    "twine>=6",
]

[tool.setuptools.dynamic]
version = { attr = "unzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unzer = [
    "py.typed",
]

[project.urls]
Documentation = "https://github.com/mausbrand/unzer-python-sdk#readme"
Repository = "https://github.com/mausbrand/unzer-python-sdk.git"
"Bug Tracker" = "https://github.com/mausbrand/unzer-python-sdk/issues"
Changelog = "https://github.com/mausbrand/unzer-python-sdk/releases"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Sandbox tests are opt-in: `pytest -m sandbox` or `pytest --sandbox`. Without
# this, a leftover .env would make every plain `pytest` create real resources.
addopts = "--strict-markers -m 'not sandbox'"
markers = [
    "sandbox: talks to the Unzer sandbox; skipped unless UNZER_PRIVATE_KEY is set",
]

[tool.coverage.run]
branch = true
source = ["src/unzer"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle, same as the tox.ini config
    "F",        # pyflakes: undefined names, unused imports
    "I",        # import sorting
    "UP",       # outdated syntax for the supported Python versions
    "B",        # likely bugs (flake8-bugbear)
    "C4",       # comprehensions
    "SIM",      # simplifiable constructs
    "PIE",      # misc. lint
    "RET",      # return statements
    "PTH",      # prefer pathlib over os.path
    "RUF",      # ruff's own rules
]
ignore = [
    # Deliberate deviations, see AGENTS.md:
    "N",        # naming — the public API mirrors the camelCase of the Unzer payload
    "F403",     # `from .model import *` in client.py
    "F405",     # and the names it brings in
    "RUF002",   # em dashes and typographic quotes in docstrings are wanted
    "E226",     # missing whitespace around arithmetic operator, waived since forever
    "RUF022",   # `__all__` is grouped by module on purpose, not sorted alphabetically
]

[tool.ruff.lint.per-file-ignores]
# Tests import inside functions on purpose, to keep each case readable on its own.
"tests/*" = ["PLC0415"]
